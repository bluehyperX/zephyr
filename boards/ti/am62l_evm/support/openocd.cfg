#
# Texas Instruments AM62L EVM — OpenOCD configuration
#
# Standalone config — does not source ti_k3.cfg to avoid the AM625 TAP ID
# mismatch (AM625=0x0bb7e02f, AM62L=0x0bba702f; differ in PARTNO, not just
# the version nibble, so -ignore-version alone does not help).
#
# Only the two A53 cores used by Zephyr are declared; sysctrl/gp_mcu are
# intentionally omitted — their power-AP unlock register offsets differ from
# AM625 and cause a bus error on the external XDS110.
#
# Hardware addresses (from CCS AM62L.xml / K3-socinfo):
#   TAP ID:  0x0bba702f (PARTNO 0xBBA7, TI mfr 0x017)
#   CPU0:    DBGBASE=0x90010000  CTIBASE=0x90020000
#   CPU1:    DBGBASE=0x90110000  CTIBASE=0x90120000

transport select jtag

source [find interface/xds110.cfg]
source [find target/swj-dp.tcl]
reset_config none
adapter speed 1000

swj_newdap am62l cpu -irlen 4 -expected-id 0x0bba702f -ignore-version

dap create am62l.dap -chain-position am62l.cpu

# A53 core 0
cti create am62l.cti.a53.0 -dap am62l.dap -ap-num 1 -baseaddr 0x90020000
target create am62l.cpu.a53.0 aarch64 -dap am62l.dap \
    -dbgbase 0x90010000 -cti am62l.cti.a53.0 -defer-examine

am62l.cpu.a53.0 configure -event gdb-attach {
    arp_examine
    halt
}

# A53 core 1
cti create am62l.cti.a53.1 -dap am62l.dap -ap-num 1 -baseaddr 0x90120000
target create am62l.cpu.a53.1 aarch64 -dap am62l.dap \
    -dbgbase 0x90110000 -cti am62l.cti.a53.1 -defer-examine

am62l.cpu.a53.1 configure -event gdb-attach {
    arp_examine
    halt
}
