# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y

# Counter driver for RTC wakeup alarm
CONFIG_COUNTER=y

# EEPROM driver for I2C suspend/resume verification
CONFIG_EEPROM=y

# Logging — immediate mode serializes UART output across SMP CPUs
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Debugging
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y
