# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y

# SMP CPU masking for CPU1-pinned threads
CONFIG_SCHED_CPU_MASK=y

# Wake CPU0 when a CPU1-pinned thread preempts a thread that can run on CPU0
CONFIG_SCHED_IPI_CASCADE=y

# Counter driver for RTC wakeup alarm
CONFIG_COUNTER=y

# Logging - immediate mode
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y